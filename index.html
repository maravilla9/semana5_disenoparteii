<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Memorama UML · UTEL">
<meta property="og:description" content="Encuentra las 6 parejas de diseño orientado a objetos. ¿Me superas?">
<title>Memorama UML</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: columna única. Marcador arriba; tablero de 12 cartas (3 columnas en celular, 4 en pantalla ancha); explicación debajo. */
:root {
  --bg: #F2F8F1; --surface: #FFFFFF; --ink: #15211A; --muted: #5A6B5E; --line: #D8E5D6;
  --green: #07B708; --green-deep: #057A0A; --green-soft: #E2F6E2;
  --violet: #5B2BC4; --violet-soft: #EEE8FB; --gold: #F2B400;
  --bad: #D62828; --bad-soft: #FDE4E4; --ok: #0E8F4A; --ok-soft: #DDF5E7;
  --a-in: #2E7DD7; --a-out: #D6338A; --a-file: #0E9C94; --a-proc: #F07B00;
  --mock: #FAFAF7; --mock-ink: #2B2B2B; --mock-line: #C9C9C2; --logo-bg: transparent;
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1510; --surface: #18221B; --ink: #E9F1EA; --muted: #9FB2A3; --line: #2B3B2F;
  --green: #22C93A; --green-deep: #62E072; --green-soft: #1A3320; --violet: #A88BFF; --violet-soft: #2A2342;
  --bad: #FF7676; --bad-soft: #3B1C1C; --ok: #4ADE80; --ok-soft: #173524; --logo-bg: #FFFFFF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1510; --surface: #18221B; --ink: #E9F1EA; --muted: #9FB2A3; --line: #2B3B2F;
  --green: #22C93A; --green-deep: #62E072; --green-soft: #1A3320; --violet: #A88BFF; --violet-soft: #2A2342;
  --bad: #FF7676; --bad-soft: #3B1C1C; --ok: #4ADE80; --ok-soft: #173524; --logo-bg: #FFFFFF; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 12px; }
.logo { width: 92px; height: auto; background: var(--logo-bg); border-radius: 10px; padding: 4px 6px; flex: none; }
.ttl { min-width: 0; }
.ttl h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.15rem, 4.6vw, 1.5rem); margin: 0; line-height: 1.15; color: var(--green-deep); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { font-family: var(--f-display); font-weight: 700; font-size: .78rem; background: var(--green); color: #06260A; border-radius: 999px; padding: 2px 12px; }
.badge.rec { background: var(--violet); color: #FFFFFF; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-size: clamp(1.3rem, 5vw, 1.65rem); margin: 0; line-height: 1.2; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; }
.rec-note { color: var(--violet); font-weight: 600; margin: 0; }
.case { background: var(--bad-soft); border-radius: 12px; padding: 12px 14px; }
.case b { color: var(--bad); font-family: var(--f-display); }
.case ul { margin: 6px 0 0; padding-left: 18px; }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; font-weight: 700; color: #FFFFFF; border-radius: 999px; padding: 2px 10px; font-family: var(--f-display); }
.t-in { background: var(--a-in); } .t-out { background: var(--a-out); } .t-file { background: var(--a-file); } .t-proc { background: var(--a-proc); }
.how { display: flex; align-items: center; gap: 12px; background: var(--violet-soft); border-radius: 12px; padding: 12px 14px; }
.how .lupa { font-size: 1.8rem; animation: look 2.2s ease-in-out infinite; }
@keyframes look { 0%,100% { transform: translate(0,0) rotate(0) } 33% { transform: translate(10px,-6px) rotate(10deg) } 66% { transform: translate(-6px,4px) rotate(-8deg) } }
label { font-weight: 600; font-size: .92rem; }
input[type=text] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=text]:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 14px; padding: 14px 20px; min-height: 52px; cursor: pointer; background: var(--green); color: #06260A; box-shadow: 0 4px 0 var(--green-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-deep); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .hs:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--f-display); font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.pill b { color: var(--green-deep); }
.pill.time b { color: var(--violet); }
.pill.time.low b { color: var(--bad); animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35 } }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--violet); width: 100%; transition: width 1s linear; }
.bar.low i { background: var(--bad); }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }

/* pantallas simuladas */
.screenhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.screenhead b { font-family: var(--f-display); }
.screenhead span { font-size: .82rem; color: var(--muted); }
.mock { position: relative; background: var(--mock); color: var(--mock-ink); border: 1px solid var(--mock-line); border-radius: 10px; overflow: hidden; cursor: zoom-in; user-select: none; }
.mock.shake { animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25%,75% { transform: translateX(-6px) } 50% { transform: translateX(6px) } }
.mbar { background: #6B6B6B; color: #FFFFFF; font: 600 .82rem/1 Arial, sans-serif; padding: 8px 10px; display: flex; gap: 6px; align-items: center; }
.mbar i { width: 9px; height: 9px; border-radius: 50%; background: #D9D9D9; display: inline-block; }
.mbody { padding: 14px; display: flex; flex-direction: column; gap: 10px; font-family: Arial, sans-serif; font-size: .9rem; }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 460px) { .mgrid { grid-template-columns: 1fr; } }
.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.f .lbl { font-size: .8rem; color: #444; }
.f .box { border: 1px solid #A9A9A2; background: #FFFFFF; padding: 7px 8px; font-size: .88rem; border-radius: 3px; min-height: 32px; display: flex; justify-content: space-between; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.f .box .ph { color: #9A9A9A; }
.mrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.okbtn { border: 1px solid #8A8A8A; background: #E6E6E6; padding: 6px 18px; font-size: .88rem; border-radius: 3px; }
.vague { font-size: .82rem; color: #555; }
.path { font-family: ui-monospace, Consolas, monospace; font-size: .74rem; color: #555; background: #EFEFEA; padding: 6px 8px; border-radius: 3px; overflow-wrap: anywhere; }
/* boleta */
.paper { background: #FFFFFF; margin: 12px; border: 1px solid #D0D0C8; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-family: "Times New Roman", serif; color: #333; }
.ph1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ph1 b { font-size: 1rem; }
.who { font-size: .82rem; }
.who u { display: inline-block; min-width: 70px; }
.tiny { font-size: 6.5px; line-height: 1.05; letter-spacing: -.3px; color: #8A8A8A; word-break: break-all; }
.sign { display: flex; justify-content: space-between; font-size: .72rem; color: #666; gap: 8px; flex-wrap: wrap; }

/* hotspots */
.hs { position: relative; cursor: inherit; border-radius: 6px; }
.hs.found { cursor: default; }
.hs.found::after { content: ""; position: absolute; inset: -6px; border: 3px solid var(--ok); border-radius: 12px; animation: ring .45s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.hs.missed::after { content: ""; position: absolute; inset: -6px; border: 3px dashed var(--bad); border-radius: 12px; pointer-events: none; }
@keyframes ring { 0% { transform: scale(1.5); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
.num { position: absolute; top: -12px; right: -10px; z-index: 2; width: 24px; height: 24px; border-radius: 50%; color: #FFF; font: 700 .78rem/24px var(--f-display); text-align: center; pointer-events: none; animation: ring .45s cubic-bezier(.3,1.6,.5,1); }

/* hallazgos */
.finds { display: flex; flex-direction: column; gap: 8px; }
.find { border-radius: 12px; padding: 10px 12px; background: var(--ok-soft); display: flex; gap: 10px; align-items: flex-start; animation: slide .35s ease; }
.find.miss { background: var(--bad-soft); }
.find .n { flex: none; width: 26px; height: 26px; border-radius: 50%; color: #FFF; font: 700 .8rem/26px var(--f-display); text-align: center; }
.find p { margin: 0; font-size: .92rem; }
.find p b { font-family: var(--f-display); }
@keyframes slide { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
.float { position: fixed; z-index: 60; pointer-events: none; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; animation: up .9s ease forwards; transform: translate(-50%, 0); }
.float.ok { color: var(--ok); } .float.bad { color: var(--bad); }
@keyframes up { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6) } 20% { opacity: 1; transform: translate(-50%, -8px) scale(1.15) } 100% { opacity: 0; transform: translate(-50%, -50px) } }

/* resultado */
.result { text-align: center; align-items: center; }
.stars { font-size: 2.6rem; letter-spacing: 6px; }
.stars span { display: inline-block; color: var(--line); }
.stars span.on { color: var(--gold); animation: star .5s cubic-bezier(.3,1.7,.5,1) both; }
.stars span.on:nth-child(2) { animation-delay: .2s } .stars span.on:nth-child(3) { animation-delay: .4s }
@keyframes star { 0% { transform: scale(0) rotate(-90deg) } 100% { transform: scale(1) rotate(0) } }
.cert { width: 100%; border: 2px dashed var(--green); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.cert b { font-family: var(--f-display); font-size: 1.1rem; }
.cert span { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.left { text-align: left; width: 100%; }
.fixed .box { border-color: #5E8F62; }
.fixed .req { color: #C62828; }
.goodbtn { border: 0; background: #07B708; color: #FFFFFF; padding: 7px 14px; font-size: .88rem; border-radius: 4px; font-weight: 700; }
.goodmsg { background: #E2F6E2; color: #05600A; border: 1px solid #07B708; padding: 6px 8px; font-size: .82rem; border-radius: 4px; }
.gtable { width: 100%; border-collapse: collapse; font-size: .82rem; }
.gtable th, .gtable td { border: 1px solid #CFCFC7; padding: 4px 6px; text-align: left; }
.gtable th { background: #EFF6EE; }
.tablewrap { overflow-x: auto; }
/* dinámica extra */
.cd { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); }
.cd span { font-family: var(--f-display); font-weight: 800; font-size: clamp(5rem, 28vw, 9rem); color: var(--violet); animation: cdpop .9s ease both; }
@keyframes cdpop { 0% { transform: scale(2.2); opacity: 0 } 30% { transform: scale(1); opacity: 1 } 100% { transform: scale(.6); opacity: 0 } }
.lens { position: fixed; z-index: 40; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 4px solid var(--violet); box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 6px 16px rgba(0,0,0,.25); pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.08), rgba(91,43,196,.08)); }
.lens::after { content: ""; position: absolute; width: 30px; height: 7px; background: var(--violet); border-radius: 4px; right: -24px; bottom: -6px; transform: rotate(45deg); }
.ripple { position: fixed; z-index: 45; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--c, var(--violet)); pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { to { transform: scale(5); opacity: 0 } }
.combo { position: fixed; left: 50%; top: 32%; z-index: 65; transform: translateX(-50%); font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.6rem); color: #FFFFFF; background: var(--violet); padding: 6px 22px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.25); pointer-events: none; animation: combo 1s cubic-bezier(.3,1.6,.5,1) forwards; white-space: nowrap; }
@keyframes combo { 0% { transform: translateX(-50%) scale(.3) rotate(-8deg); opacity: 0 } 25% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1 } 75% { opacity: 1 } 100% { transform: translateX(-50%) scale(1) translateY(-30px); opacity: 0 } }
.flash { position: fixed; inset: 0; z-index: 44; pointer-events: none; animation: flash .35s ease forwards; }
@keyframes flash { from { opacity: .35 } to { opacity: 0 } }
.icon-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; min-width: 40px; height: 34px; cursor: pointer; font-size: 1rem; }
.pill.pts b { color: var(--violet); }
.pts-pop { animation: ptspop .4s cubic-bezier(.3,1.7,.5,1); display: inline-block; }
@keyframes ptspop { 0% { transform: scale(1.6) } 100% { transform: scale(1) } }
.share { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.share b { font-family: var(--f-display); }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sbtn { font-family: var(--f-display); font-weight: 700; font-size: .95rem; border: 0; border-radius: 12px; padding: 12px 10px; min-height: 48px; cursor: pointer; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
.sbtn.wa { background: #1FA855; } .sbtn.fb { background: #1877F2; } .sbtn.x { background: #111111; } .sbtn.cp { background: var(--violet); } .sbtn.img { background: #E1306C; } .sbtn.nat { background: var(--green-deep); }
.sbtn svg { width: 20px; height: 20px; flex: none; }
.copied { font-size: .85rem; color: var(--ok); min-height: 1.2em; margin: 0; }
.big-score { font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; color: var(--violet); line-height: 1; font-variant-numeric: tabular-nums; }
.big-score small { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
footer { text-align: center; font-size: .82rem; color: var(--muted); }
footer b { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 600px) { .board { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.mc { border: 0; padding: 0; background: none; aspect-ratio: 3 / 4; max-width: 100%; perspective: 900px; cursor: pointer; min-width: 0; }
.mc:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; border-radius: 14px; }
.mi { position: relative; display: block; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.3,1.3,.5,1); transform-style: preserve-3d; }
.mc.up .mi { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.back { background: linear-gradient(145deg, #07B708, #5B2BC4); color: #FFFFFF; }
.back img { width: 64%; max-width: 90px; filter: brightness(0) invert(1); opacity: .95; }
.back em { font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; opacity: .8; }
.mc:hover:not(.up) .back { filter: brightness(1.08); transform: translateY(-2px); }
.front { transform: rotateY(180deg); background: var(--surface); border: 3px solid var(--c); }
.front b { font-family: var(--f-display); font-weight: 800; font-size: clamp(.82rem, 3.6vw, 1.05rem); line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.front b.code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: #B0246F; }
.front small { font-size: .68rem; color: var(--muted); line-height: 1.2; }
.front.a { background: var(--c); }
.front.a b { color: #FFFFFF; font-size: clamp(.95rem, 4.2vw, 1.2rem); }
.front.a small { color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: .06em; }
.mc.match .mi { animation: matchpop .5s cubic-bezier(.3,1.6,.5,1); }
.mc.match .front { box-shadow: 0 0 0 4px var(--ok), 0 6px 14px rgba(0,0,0,.18); }
.mc.match { cursor: default; }
@keyframes matchpop { 0% { transform: rotateY(180deg) scale(1) } 50% { transform: rotateY(180deg) scale(1.1) } 100% { transform: rotateY(180deg) scale(1) } }
.mc.nope .front { animation: shake .4s ease; box-shadow: 0 0 0 4px var(--bad); }
.fbk { min-height: 2.6em; margin-top: 12px; }
.fbk p { margin: 0; border-radius: 10px; padding: 8px 12px; font-size: .92rem; animation: slide .3s ease; }
.fbk .good { background: var(--ok-soft); }
.fbk .badm { background: var(--bad-soft); }
</style>
</head>

<canvas id="fx"></canvas>

function start() {
  app.innerHTML = `<section class="panel">
    <p class="rec-note">🎮 Actividad recreativa: juega, aprende y diviértete.</p>
    <h2>Repasa el diseño de la universidad</h2>
    <div class="case"><b>Recuerda la situación práctica:</b>
      <ul><li>La universidad tendrá una app, un portal para docentes y una segunda sede.</li><li>Para crecer sin rehacer el sistema, se diseña con objetos y UML.</li></ul></div>
    <p class="lead">Encuentra las <b>6 parejas</b>: cada concepto con su ejemplo de la universidad.</p>
    <div class="how"><span class="lupa" aria-hidden="true">🃏</span><span>Toca dos cartas. Si son pareja, se quedan volteadas. Si no, se vuelven a tapar. ¡Usa la memoria!</span></div>
    <label for="nm">Tu nombre</label>
    <input id="nm" type="text" maxlength="40" autocomplete="name" placeholder="Escribe tu nombre">
    <button class="btn" id="go" disabled>¡Jugar!</button></section>`;
  const nm = $("#nm"), go = $("#go");
  nm.value = S.name; go.disabled = !nm.value.trim();
  nm.addEventListener("input", () => (go.disabled = !nm.value.trim()));
  nm.addEventListener("keydown", (e) => { if (e.key === "Enter" && nm.value.trim()) go.click(); });
  go.addEventListener("click", () => { S.name = nm.value.trim(); play(); });
}

function play() {
  S.deck = shuffle(PAIRS.flatMap((p) => [{ ...p, side: "a" }, { ...p, side: "b" }]));
  S.open = []; S.found = 0; S.moves = 0; S.pts = 0; S.t0 = 0; S.lock = false; S.over = false; S.streak = 0;
  clearInterval(S.tick);
  app.innerHTML = `
  <div class="hud"><div class="hudrow"><span class="pill">🃏 <b id="fnd">0/6</b></span><span class="pill pts">⭐ <b id="pts">0</b></span><span class="pill">🔄 <b id="mv">0</b></span><span class="pill time">⏱ <b id="clk">0:00</b></span><button class="icon-btn" id="snd" aria-label="Sonido">${S.sound ? "🔊" : "🔇"}</button></div></div>
  <section class="panel">
    <div class="board" id="board">${S.deck.map((c, i) => `
      <button class="mc" data-i="${i}" aria-label="Carta ${i + 1}">
        <span class="mi">
          <span class="face back"><img src="${$(".logo").src}" alt=""><em>?</em></span>
          <span class="face front ${c.side}" style="--c:${c.c}">${c.side === "a" ? `<b>${c.a}</b><small>Concepto</small>` : `<b class="${c.code ? "code" : ""}">${esc(c.b)}</b><small>${c.sb}</small>`}</span>
        </span>
      </button>`).join("")}</div>
    <div id="fb" class="fbk" aria-live="polite"><p class="hint" style="margin:0">Toca una carta para empezar.</p></div>
  </section>`;
  $("#snd").addEventListener("click", () => { S.sound = !S.sound; $("#snd").textContent = S.sound ? "🔊" : "🔇"; });
  app.querySelectorAll(".mc").forEach((b) => b.addEventListener("click", (e) => flip(b, e)));
  window.scrollTo({ top: 0 });
}

function flip(btn, e) {
  if (S.lock || S.over || btn.classList.contains("up")) return;
  if (!S.t0) { S.t0 = Date.now(); S.tick = setInterval(() => { const c = $("#clk"); if (c) c.textContent = fmt(Date.now() - S.t0); }, 500); }
  btn.classList.add("up"); beep(700, .06, "triangle", .06);
  S.open.push(btn);
  if (S.open.length < 2) return;
  S.moves++; $("#mv").textContent = S.moves;
  const [b1, b2] = S.open, c1 = S.deck[b1.dataset.i], c2 = S.deck[b2.dataset.i];
  if (c1.id === c2.id && c1.side !== c2.side) {
    S.open = []; S.found++; S.streak++;
    const gain = 100 + (S.streak > 1 ? (S.streak - 1) * 50 : 0);
    setPts(gain); $("#fnd").textContent = S.found + "/6";
    [b1, b2].forEach((b) => { b.classList.add("match"); b.disabled = true; });
    const r = b2.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    floatText("+" + gain, x, r.top, "ok"); burst(x, y, 22); flash("var(--ok)");
    if (S.streak >= 2) { sCombo(); const c = document.createElement("div"); c.className = "combo"; c.textContent = "¡Racha x" + S.streak + "!"; document.body.appendChild(c); setTimeout(() => c.remove(), 1050); } else sOk();
    $("#fb").innerHTML = `<p class="good"><b style="color:${c1.c}">${c1.a}:</b> ${c1.why}</p>`;
    if (S.found === PAIRS.length) setTimeout(end, 900);
  } else {
    S.lock = true; S.streak = 0;
    setTimeout(() => {
      [b1, b2].forEach((b) => { b.classList.add("nope"); });
      sBad();
      setTimeout(() => { [b1, b2].forEach((b) => b.classList.remove("up", "nope")); S.open = []; S.lock = false; }, 450);
    }, 650);
    $("#fb").innerHTML = `<p class="badm">No son pareja. ¡Recuerda dónde estaban!</p>`;
  }
}

function end() {
  S.over = true; clearInterval(S.tick);
  const ms = Date.now() - S.t0;
  const bonus = Math.max(0, 300 - Math.floor(ms / 1000) * 3); S.pts += bonus;
  const stars = S.moves <= 9 ? 3 : S.moves <= 13 ? 2 : 1;
  const title = stars === 3 ? "¡Memoria de arquitecto!" : stars === 2 ? "¡Muy bien!" : "¡Lo lograste!";
  if (stars >= 2) sWin(); else sOk();
  const today = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  const list = PAIRS.map((p) => `<div class="find"><span class="n" style="background:${p.c}">✓</span><p><b>${p.a} · ${esc(p.b)}.</b> ${p.why}</p></div>`).join("");
  app.innerHTML = `<section class="panel result">
    <div class="stars" aria-label="${stars} de 3 estrellas">${[1, 2, 3].map((k) => `<span class="${k <= stars ? "on" : ""}">★</span>`).join("")}</div>
    <h2>${title}</h2>
    <p class="lead">Encontraste las 6 parejas en <b>${S.moves} intentos</b>. Con estos conceptos la universidad puede crecer sin rehacer su sistema.</p>
    <div class="big-score">${S.pts}<small>puntos${bonus ? " · incluye " + bonus + " de bono por rapidez" : ""}</small></div>
    <div class="cert"><b>${esc(S.name)}</b><span>${S.moves} intentos · Tiempo ${fmt(ms)}</span><span>${today} · Semana 5 · Actividad recreativa</span><span>Docente: Dr. Armando Maravilla</span></div>
    <div class="share"><b>Reta a tus compañeros 📲</b>
      <div class="sgrid">
        <button class="sbtn nat" id="sh-nat" hidden>📤 Compartir</button>
        <a class="sbtn wa" id="sh-wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2l-.5-.2Z"/></svg>WhatsApp</a>
        <a class="sbtn fb" id="sh-fb" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8Z"/></svg>Facebook</a>
        <a class="sbtn x" id="sh-x" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7 8 10.3h-6.2l-4.9-6.3L5.4 21H2.3l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg>X (Twitter)</a>
        <button class="sbtn cp" id="sh-cp">🔗 Copiar mensaje</button>
        <button class="sbtn img" id="sh-img">🖼️ Imagen para historias</button>
      </div>
      <p class="copied" id="copied" aria-live="polite"></p>
    </div>
    <p class="lead" style="font-size:.92rem">💬 Comparte también en el chat de la clase tus intentos y puntos.</p>
    <button class="btn" id="again">Jugar de nuevo</button></section>
  <section class="panel"><b style="font-family:var(--f-display)">Las 6 parejas</b><div class="finds">${list}</div></section>`;
  $("#again").addEventListener("click", play);
  setupShare(S.moves, stars);
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (stars >= 2) confetti();
}

function countdown(done) {
  const o = document.createElement("div"); o.className = "cd"; document.body.appendChild(o);
  const seq = ["3", "2", "1", "¡Ya!"]; let i = 0;
  const step = () => {
    if (i >= seq.length) { o.remove(); done(); return; }
    o.innerHTML = `<span>${seq[i]}</span>`; beep(i < 3 ? 520 : 880, i < 3 ? .12 : .25, "square", .06); i++;
    setTimeout(step, reduce ? 300 : 800);
  };
  step();
}

/* sonido (se activa después de tocar un botón) */
let AC = null;
function beep(f, d, type = "sine", vol = .08, when = 0) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sOk = () => { beep(660, .12, "triangle", .1); beep(990, .18, "triangle", .1, .09); };
const sCombo = () => { [660, 830, 990, 1320].forEach((f, i) => beep(f, .14, "triangle", .09, i * .07)); };
const sBad = () => { beep(160, .25, "sawtooth", .07); };
const sTick = () => beep(1200, .04, "square", .03);
const sWin = () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, .2, "triangle", .1, i * .12)); };
const sLose = () => { [392, 330, 262].forEach((f, i) => beep(f, .28, "sine", .09, i * .2)); };
function ripple(x, y, c) {
  const r = document.createElement("div"); r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px";
  if (c) r.style.setProperty("--c", c); document.body.appendChild(r); setTimeout(() => r.remove(), 600);
}
function flash(c) { if (reduce) return; const f = document.createElement("div"); f.className = "flash"; f.style.background = c; document.body.appendChild(f); setTimeout(() => f.remove(), 400); }
function setPts(add) { S.pts = Math.max(0, S.pts + add); const b = $("#pts"); if (!b) return; b.textContent = S.pts; b.classList.remove("pts-pop"); void b.offsetWidth; b.classList.add("pts-pop"); }
function floatText(t, x, y, cls) {
  const f = document.createElement("div"); f.className = "float " + cls; f.textContent = t;
  f.style.left = x + "px"; f.style.top = y + "px"; document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}

/* efectos */
const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
let parts = [], raf = 0;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
const COLORS = ["#07B708", "#F2B400", "#5B2BC4", "#D6338A", "#2E7DD7", "#F07B00"];
function burst(x, y, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, g: .18, life: 40 + Math.random() * 20, c: COLORS[i % COLORS.length], r: 3 + Math.random() * 3, rot: 0, vr: 0 }); }
  loop();
}
function confetti() {
  if (reduce) return;
  for (let i = 0; i < 160; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, g: .05, life: 220, c: COLORS[i % COLORS.length], r: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, rect: true });
  loop();
}
function loop() {
  if (raf) return;
  const step = () => {
    const d = devicePixelRatio; ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x * d, p.y * d); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 30);
      if (p.rect) ctx.fillRect(-p.r * d, -p.r * d / 2, p.r * 2 * d, p.r * d); else { ctx.beginPath(); ctx.arc(0, 0, p.r * d, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; ctx.clearRect(0, 0, cv.width, cv.height); }
  };
  raf = requestAnimationFrame(step);
}



/* compartir */
function gameUrl() { return location.protocol.startsWith("http") ? location.href.split("#")[0] : ""; }
function shareText(n) {
  const u = gameUrl();
  return `🃏 Completé el "Memorama UML" en ${n} intentos y saqué ${S.pts} puntos. ¿Me superas?` + (u ? " " + u : "") + " #UTEL #AnálisisYDiseño";
}
function setupShare(n, stars) {
  const txt = shareText(n), u = gameUrl(), enc = encodeURIComponent;
  $("#sh-wa").href = "https://wa.me/?text=" + enc(txt);
  $("#sh-x").href = "https://twitter.com/intent/tweet?text=" + enc(txt);
  const fb = $("#sh-fb");
  if (u) fb.href = "https://www.facebook.com/sharer/sharer.php?u=" + enc(u); else fb.hidden = true;
  if (navigator.share) {
    const nat = $("#sh-nat"); nat.hidden = false;
    nat.addEventListener("click", async () => {
      try {
        const blob = await cardBlob(n, stars), file = blob && new File([blob], "memorama-uml.png", { type: "image/png" });
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: txt });
        else await navigator.share({ text: txt, url: u || undefined });
      } catch (e) {}
    });
  }
  $("#sh-cp").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(txt); $("#copied").textContent = "Mensaje copiado. Pégalo en tu red social favorita."; }
    catch (e) { $("#copied").textContent = txt; }
  });
  $("#sh-img").addEventListener("click", async () => {
    const blob = await cardBlob(n, stars); if (!blob) return;
    const file = new File([blob], "memorama-uml.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text: txt }); return; } catch (e) {} }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "memorama-uml.png";
    document.body.appendChild(a); a.click(); a.remove();
    $("#copied").textContent = "Imagen descargada. Súbela a tus historias.";
  });
}
function cardBlob(n, stars) {
  return new Promise((res) => {
    const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, W, H); grd.addColorStop(0, "#5B2BC4"); grd.addColorStop(1, "#07B708");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) { g.fillStyle = ["#F2B400", "#FFFFFF", "#D6338A", "#2E7DD7"][i % 4]; g.globalAlpha = .35; g.fillRect(Math.random() * W, Math.random() * H, 14, 7); }
    g.globalAlpha = 1;
    g.fillStyle = "#FFFFFF"; roundRect(g, 70, 150, W - 140, H - 300, 48); g.fill();
    const draw = () => {
      g.textAlign = "center"; g.fillStyle = "#057A0A"; g.font = "800 72px Poppins, Arial, sans-serif"; g.fillText("Memorama UML", W / 2, 405);
      g.fillStyle = "#5B2BC4"; g.font = "700 40px Poppins, Arial, sans-serif"; g.fillText("Semana 5 · Diseño orientado a objetos", W / 2, 468);
      g.font = "130px Arial, sans-serif"; g.fillStyle = "#F2B400"; g.fillText("★".repeat(stars) + "☆".repeat(3 - stars), W / 2, 630);
      g.fillStyle = "#15211A"; g.font = "800 150px Poppins, Arial, sans-serif"; g.fillText(String(S.pts), W / 2, 805);
      g.font = "600 44px 'Work Sans', Arial, sans-serif"; g.fillStyle = "#5A6B5E"; g.fillText("puntos · " + n + " intentos", W / 2, 868);
      g.fillStyle = "#15211A"; g.font = "700 56px Poppins, Arial, sans-serif"; g.fillText(S.name.slice(0, 28), W / 2, 960);
      g.fillStyle = "#5B2BC4"; g.font = "700 48px Poppins, Arial, sans-serif"; g.fillText("¿Me superas? 🃏", W / 2, 1050);
      g.fillStyle = "#5A6B5E"; g.font = "500 32px 'Work Sans', Arial, sans-serif"; g.fillText("Docente: Dr. Armando Maravilla · Actividad recreativa", W / 2, 1120);
      g.fillStyle = "#FFFFFF"; g.font = "700 38px Poppins, Arial, sans-serif"; g.fillText("Análisis y diseño de sistemas", W / 2, H - 80);
      c.toBlob((b) => res(b), "image/png");
    };
    const logo = new Image(); logo.onload = () => { const lw = 260, lh = lw * logo.height / logo.width; g.drawImage(logo, W / 2 - lw / 2, 180, lw, lh); draw(); }; logo.onerror = draw;
    logo.src = document.querySelector(".logo").src;
  });
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }


start();
</script>
